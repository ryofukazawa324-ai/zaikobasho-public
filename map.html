<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>前レジ在庫マップ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:14px 12px 90px}.top,.bar,.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:14px;margin-bottom:12px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#6b7280}button{border:0;border-radius:11px;padding:9px 11px;font:inherit;font-weight:700}.primary{background:#2563eb;color:#fff}.ghost{background:#f9fafb;border:1px solid #e5e7eb}.danger{background:#fff1f2;color:#dc2626}.small{font-size:12px;padding:7px 8px}.map{position:relative;width:100%;height:min(70vh,620px);min-height:440px;background:#fafafa;border:2px solid #d1d5db;border-radius:14px;overflow:hidden;touch-action:none}.grid{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#94a3b8 1.6px,transparent 1.8px);background-size:24px 24px;background-position:-1px -1px}.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.line{stroke:#111827;stroke-width:2.2;vector-effect:non-scaling-stroke}.block{position:absolute;border:2px solid #111827;border-radius:7px;box-shadow:0 2px 5px #0002;user-select:none;overflow:visible}.block.selected{outline:3px solid #2563eb;outline-offset:2px}.block.multiSelected{outline:4px solid #7c3aed;outline-offset:2px}.orderBadge{position:absolute;left:-9px;top:-9px;z-index:5;width:22px;height:22px;border-radius:50%;background:#7c3aed;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.blockInner{position:absolute;inset:4px;display:flex;flex-direction:column;overflow:hidden;min-width:0}.blockName{flex:0 0 auto;width:100%;text-align:center;font-size:12px;font-weight:900;line-height:1.15;padding:2px 3px;overflow:hidden;text-overflow:ellipsis}.block.hasContents .blockName{border-bottom:1px solid #11182755;padding-bottom:3px;margin-bottom:3px}.blockContents{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:flex-start;justify-content:center;text-align:center;white-space:pre-wrap;overflow:auto;font-size:10px;font-weight:700;line-height:1.2;padding:1px 3px}.resize{position:absolute;right:-8px;bottom:-8px;width:22px;height:22px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 1px 5px #0005;z-index:4;touch-action:none}.modal{position:fixed;inset:0;background:#11182780;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.box{background:#fff;border-radius:18px;padding:15px;width:min(100%,620px);max-height:90vh;overflow:auto}.hidden{display:none!important}input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}textarea{min-height:80px}.field{margin:9px 0}.label{font-size:12px;color:#6b7280;margin-bottom:4px}.help{background:#eff6ff;border-color:#bfdbfe}.back{text-decoration:none;color:#2563eb;font-weight:800}.tools{display:flex;gap:6px;flex-wrap:wrap}.tool.on{background:#111827;color:#fff}.multiTool.on{background:#7c3aed;color:#fff}.white{background:#fff!important;color:#111827!important}.sizeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.multiStatus{margin-top:8px;padding:8px 10px;border-radius:10px;background:#f5f3ff;color:#5b21b6;font-size:12px;font-weight:800}@media(min-width:700px){.modal{align-items:center}}</style></head><body><div class="wrap"><div class="card top"><div><h1>前レジ在庫マップ</h1></div><b id="code">---</b></div><div class="card"><div class="bar"><b>配置マップ</b><button id="edit" class="ghost">編集モード</button></div><div id="tools" class="tools hidden" style="margin-top:10px"><button id="add" class="primary small">＋色図形</button><button id="addWhite" class="ghost small">＋白図形</button><button id="lineTool" class="ghost small tool">／ 線を引く</button><button id="editBlock" class="ghost small">図形を編集</button><button id="duplicateBlock" class="ghost small">⧉ 複製</button><button id="multiTool" class="ghost small multiTool">複数選択</button><button id="distribute" class="ghost small hidden">↔ 横に等間隔</button><button id="clearMulti" class="ghost small hidden">選択解除</button><button id="deleteLine" class="danger small">線を1本戻す</button></div><div id="multiStatus" class="multiStatus hidden"></div></div><div id="help" class="card help hidden"><b>編集方法</b><div class="sub">通常は図形をタップして移動・編集できます。「複数選択」をONにすると、図形を選んだ順番を記憶します。3個以上選んで「横に等間隔」を押すと、1個目と最後を両端にして隙間を等間隔にし、縦位置は1個目に揃えます。</div></div><div class="card"><div id="map" class="map"><div class="grid"></div><svg id="lines" class="lines" preserveAspectRatio="none"></svg><div id="blocks"></div></div></div><div id="legend" class="hidden"></div></div><div id="modal" class="modal hidden"><div class="box"><h3 id="modalTitle">図形を追加</h3><div class="field"><div class="label">場所名</div><input id="name" placeholder="例：左キャビネット"></div><div class="field"><div class="label">この図形にあるもの（図の中にも表示）</div><textarea id="contents" placeholder="例：ゲーム機、Apple Pencil、ドライヤー"></textarea></div><div class="field"><div class="label">色の種類</div><select id="kind"><option value="group">小項目の色を使う</option><option value="white">白・無色</option></select></div><div id="groupField" class="field"><div class="label">対応する小項目</div><select id="group"></select></div><div class="field"><div class="label">初期形</div><select id="shape"><option value="wide">横長</option><option value="square">正方形</option><option value="tall">縦長</option></select></div><div class="field"><div class="label">サイズ（%）</div><div class="sizeRow"><input id="width" type="number" min="5" max="95" step="1" placeholder="横幅"><input id="height" type="number" min="5" max="95" step="1" placeholder="高さ"></div></div><div class="row"><button id="cancel" class="ghost">キャンセル</button><button id="removeBlock" class="danger hidden">削除</button><button id="saveBlock" class="primary">保存</button></div></div></div><script>const U='https://gwmwynjkhxaywknhakcw.supabase.co',K='sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q',STORE='zaikobasho:lastCode',$=s=>document.querySelector(s);let code=localStorage.getItem(STORE)||'',data,front,map,editing=false,drag=null,resize=null,selected=null,lineMode=false,lineStart=null,editingBlock=null,multiMode=false,multiSelected=[];const colors=['#60a5fa','#facc15','#4ade80','#fb7185','#c084fc','#22d3ee','#fb923c','#a3e635','#f472b6','#94a3b8'],hdr=(x={})=>({apikey:K,Authorization:`Bearer ${K}`,...x}),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function baseDims(s){return s==='square'?[22,18]:s==='tall'?[17,30]:[34,15]}function getDims(b){let d=baseDims(b.shape);return[Number(b.w)||d[0],Number(b.h)||d[1]]}async function load(){if(!/^\d{3}$/.test(code)){code='000';localStorage.setItem(STORE,code)}$('#code').textContent=code;let r=await fetch(`${U}/rest/v1/zaikobasho_public_shared?code=eq.${code}&select=data`,{headers:hdr()}),a=await r.json();data=a[0]?.data||{sections:[]};data.sections=Array.isArray(data.sections)?data.sections:[];front=data.sections.find(s=>s.name==='前レジ')||data.sections.find(s=>String(s.name||'').includes('前レジ'));if(!front){front={id:'front-register-map-only',name:'前レジ',groups:[]}}front.groups=Array.isArray(front.groups)?front.groups:[];map=data.frontRegisterMap||{};map.blocks=Array.isArray(map.blocks)?map.blocks:[];map.lines=Array.isArray(map.lines)?map.lines:[];map.groupColors=map.groupColors||{};front.groups.forEach((g,i)=>{if(!map.groupColors[g.id])map.groupColors[g.id]=colors[i%colors.length]});data.frontRegisterMap=map;render()}async function save(){let r=await fetch(`${U}/rest/v1/zaikobasho_public_shared?on_conflict=code`,{method:'POST',headers:hdr({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({code,data,updated_at:new Date().toISOString()})});if(!r.ok)alert('保存に失敗しました')}function contrast(h){let n=parseInt(h.slice(1),16),v=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);return v>160?'#111827':'#fff'}function render(){let lines=$('#lines');lines.innerHTML=map.lines.map(l=>`<line class="line" x1="${l.x1}%" y1="${l.y1}%" x2="${l.x2}%" y2="${l.y2}%"/>`).join('')+(lineStart?`<circle cx="${lineStart.x}%" cy="${lineStart.y}%" r="5" fill="#2563eb"/>`:'');$('#blocks').innerHTML=map.blocks.map(b=>{let g=front.groups.find(x=>x.id===b.groupId),white=b.kind==='white',c=white?'#fff':(map.groupColors[b.groupId]||'#d1d5db'),[w,h]=getDims(b),has=!!(b.contents&&b.contents.trim()),mi=multiSelected.indexOf(b.id);return`<div class="block ${white?'white':''} ${has?'hasContents':''} ${selected===b.id&&!multiMode?'selected':''} ${mi>=0?'multiSelected':''}" data-id="${b.id}" style="left:${b.x}%;top:${b.y}%;width:${w}%;height:${h}%;background:${c};color:${white?'#111827':contrast(c)}">${mi>=0?`<span class="orderBadge">${mi+1}</span>`:''}<div class="blockInner"><div class="blockName">${esc(b.name||g?.name||'場所')}</div>${has?`<div class="blockContents">${esc(b.contents)}</div>`:''}</div>${editing&&selected===b.id&&!multiMode?'<span class="resize" data-resize="1"></span>':''}</div>`}).join('');$('#legend').innerHTML='';$('#tools').classList.toggle('hidden',!editing);$('#help').classList.toggle('hidden',!editing);$('#edit').textContent=editing?'編集終了':'編集モード';$('#lineTool').classList.toggle('on',lineMode);$('#multiTool').classList.toggle('on',multiMode);$('#multiTool').textContent=multiMode?'複数選択中':'複数選択';$('#distribute').classList.toggle('hidden',!editing||!multiMode||multiSelected.length<3);$('#clearMulti').classList.toggle('hidden',!editing||!multiMode||!multiSelected.length);let ms=$('#multiStatus');ms.classList.toggle('hidden',!editing||!multiMode);if(multiMode)ms.textContent=multiSelected.length?`${multiSelected.length}個選択中：紫の番号が選択順です。1番を基準、最後を終点にします。`:'図形を順番にタップしてください。3個以上で横に等間隔配置できます。'}function openModal(b=null,white=false){editingBlock=b;$('#modalTitle').textContent=b?'図形を編集':'図形を追加';$('#name').value=b?.name||'';$('#contents').value=b?.contents||'';let noGroups=!front.groups.length;$('#kind').value=b?.kind||(white||noGroups?'white':'group');$('#kind').querySelector('option[value="group"]').disabled=noGroups;$('#shape').value=b?.shape||'wide';let d=b?getDims(b):baseDims($('#shape').value);$('#width').value=Math.round(d[0]);$('#height').value=Math.round(d[1]);$('#group').innerHTML=front.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');if(b?.groupId)$('#group').value=b.groupId;$('#removeBlock').classList.toggle('hidden',!b);toggleGroup();$('#modal').classList.remove('hidden')}function toggleGroup(){$('#groupField').classList.toggle('hidden',$('#kind').value==='white'||!front.groups.length)}$('#kind').onchange=toggleGroup;$('#shape').onchange=()=>{if(editingBlock)return;let d=baseDims($('#shape').value);$('#width').value=d[0];$('#height').value=d[1]};$('#edit').onclick=()=>{editing=!editing;lineMode=false;lineStart=null;multiMode=false;multiSelected=[];selected=null;render()};$('#add').onclick=()=>openModal(null,!front.groups.length);$('#addWhite').onclick=()=>openModal(null,true);$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#saveBlock').onclick=async()=>{let kind=(!front.groups.length||$('#kind').value==='white')?'white':'group',gid=kind==='group'?$('#group').value:null,b=editingBlock;if(!b){b={id:crypto.randomUUID(),x:4,y:4};map.blocks.push(b)}b.name=$('#name').value.trim()||'場所';b.contents=$('#contents').value.trim();b.kind=kind;b.groupId=gid;b.shape=$('#shape').value;b.w=Math.max(5,Math.min(95,Number($('#width').value)||20));b.h=Math.max(5,Math.min(95,Number($('#height').value)||15));b.x=Math.min(b.x,100-b.w);b.y=Math.min(b.y,100-b.h);selected=b.id;$('#modal').classList.add('hidden');render();await save()};$('#removeBlock').onclick=async()=>{if(!editingBlock)return;if(confirm('この図形を削除しますか？')){map.blocks=map.blocks.filter(x=>x.id!==editingBlock.id);multiSelected=multiSelected.filter(id=>id!==editingBlock.id);selected=null;$('#modal').classList.add('hidden');render();await save()}};$('#editBlock').onclick=()=>{let b=map.blocks.find(x=>x.id===selected);if(!b)return alert('編集する図形を先にタップしてください');openModal(b)};$('#duplicateBlock').onclick=async()=>{let b=map.blocks.find(x=>x.id===selected);if(!b)return alert('複製する図形を先にタップしてください');let[w,h]=getDims(b),copy={...b,id:crypto.randomUUID(),x:Math.min(100-w,b.x+4),y:Math.min(100-h,b.y+4),name:b.name,contents:b.contents};map.blocks.push(copy);selected=copy.id;render();await save();openModal(copy)};$('#lineTool').onclick=()=>{lineMode=!lineMode;if(lineMode){multiMode=false;multiSelected=[]}lineStart=null;render()};$('#multiTool').onclick=()=>{multiMode=!multiMode;lineMode=false;lineStart=null;selected=null;if(!multiMode)multiSelected=[];render()};$('#clearMulti').onclick=()=>{multiSelected=[];render()};$('#distribute').onclick=async()=>{if(multiSelected.length<3)return;let bs=multiSelected.map(id=>map.blocks.find(b=>b.id===id)).filter(Boolean);if(bs.length<3)return;let first=bs[0],last=bs[bs.length-1],y=first.y,[fw]=getDims(first);let start=first.x+fw,end=last.x;if(end<start){alert('最後に選んだ図形は、最初に選んだ図形より右側に置いてください。');return}let middle=bs.slice(1,-1),total=middle.reduce((s,b)=>s+getDims(b)[0],0),gap=(end-start-total)/(bs.length-1);if(gap<0){alert('最初と最後の間隔が狭すぎます。最後の図形をもう少し右へ移動してください。');return}let x=start+gap;middle.forEach(b=>{b.x=x;b.y=y;x+=getDims(b)[0]+gap});first.y=y;last.y=y;render();await save()};$('#deleteLine').onclick=async()=>{if(!map.lines.length)return;map.lines.pop();render();await save()};function snapPoint(e){let r=$('#map').getBoundingClientRect(),gx=24/r.width*100,gy=24/r.height*100,x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;return{x:Math.max(0,Math.min(100,Math.round(x/gx)*gx)),y:Math.max(0,Math.min(100,Math.round(y/gy)*gy))}}$('#map').onpointerdown=e=>{if(!editing)return;if(lineMode){let p=snapPoint(e);if(!lineStart){lineStart=p;render()}else{map.lines.push({id:crypto.randomUUID(),x1:lineStart.x,y1:lineStart.y,x2:p.x,y2:p.y});lineStart=null;render();save()}return}let el=e.target.closest('.block');if(multiMode){if(!el)return;let id=el.dataset.id,i=multiSelected.indexOf(id);if(i>=0)multiSelected.splice(i,1);else multiSelected.push(id);render();return}if(!el){selected=null;render();return}selected=el.dataset.id;let b=map.blocks.find(x=>x.id===selected),rect=$('#map').getBoundingClientRect();if(e.target.closest('[data-resize]')){let[w,h]=getDims(b);resize={b,rect,startX:e.clientX,startY:e.clientY,w,h};e.target.setPointerCapture(e.pointerId);return}let er=el.getBoundingClientRect();drag={b,rect,dx:e.clientX-er.left,dy:e.clientY-er.top};el.setPointerCapture(e.pointerId);render()};$('#map').onpointermove=e=>{if(resize){let dw=(e.clientX-resize.startX)/resize.rect.width*100,dh=(e.clientY-resize.startY)/resize.rect.height*100;resize.b.w=Math.max(5,Math.min(100-resize.b.x,resize.w+dw));resize.b.h=Math.max(5,Math.min(100-resize.b.y,resize.h+dh));render();return}if(!drag||lineMode||multiMode)return;let[w,h]=getDims(drag.b);drag.b.x=Math.max(0,Math.min(100-w,(e.clientX-drag.rect.left-drag.dx)/drag.rect.width*100));drag.b.y=Math.max(0,Math.min(100-h,(e.clientY-drag.rect.top-drag.dy)/drag.rect.height*100));render()};$('#map').onpointerup=async()=>{if(resize){resize=null;await save()}if(drag){drag=null;await save()}};$('#map').ondblclick=e=>{if(!editing||lineMode||multiMode)return;let el=e.target.closest('.block');if(el)openModal(map.blocks.find(x=>x.id===el.dataset.id))};load();</script><script src="./map-addon.js?v=1"></script></body></html>
