<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f4f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="在庫"><title>在庫</title><link rel="icon" href="apple-touch-icon.png?v=22"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=22"><link rel="manifest" href="manifest.webmanifest?v=22"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.view{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f4f6}.tabs{display:none!important;position:fixed;z-index:999;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));height:60px;padding:5px;display:flex;gap:5px;background:#fff;border:1px solid #d1d5db;border-radius:18px;box-shadow:0 6px 28px #0003}.tab{flex:1;border:0;border-radius:13px;background:#f3f4f6;color:#4b5563;font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.tab.on{background:#111827;color:#fff}.tab span{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}.historyBtns{position:fixed;z-index:1000;left:16px;bottom:82px;display:flex;flex-direction:column;gap:7px}.historyBtn{border:1px solid #d1d5db;border-radius:14px;background:#fff;color:#111827;padding:9px 12px;font:800 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;box-shadow:0 4px 18px #0002;min-width:94px}.historyBtn:disabled{opacity:.4}.hidden{display:none!important}.quickEdit{position:static;display:block;margin:12px 12px 12px auto;z-index:1100;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:#111827;padding:7px 12px;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;box-shadow:0 3px 12px #0002}.detail{position:fixed;inset:0;z-index:2000;background:#11182788;display:flex;align-items:center;justify-content:center;padding:22px}.detailCard{width:min(90vw,440px);max-height:72vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 18px 60px #0005}.detailName{font-size:14px;font-weight:800;color:#6b7280;border-bottom:1px solid #e5e7eb;padding-bottom:9px;margin-bottom:12px}.detailContents{font-size:22px;line-height:1.45;font-weight:900;white-space:pre-wrap;word-break:break-word}.detailClose{width:100%;margin-top:18px;border:0;border-radius:12px;padding:12px;background:#111827;color:#fff;font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style></head><body><iframe id="view" class="view" title="在庫"></iframe><button id="quickEdit" class="quickEdit">編集</button><div id="historyBtns" class="historyBtns hidden"><button id="redo" class="historyBtn" disabled>↷ 1つ送る</button><button id="undo" class="historyBtn" disabled>↶ 1つ戻す</button></div><nav class="tabs"><button id="listTab" class="tab">在庫一覧<span>メモ・写真</span></button><button id="mapTab" class="tab">マップ<span>前レジ配置</span></button><button id="editTab" class="tab hidden">編集モード<span>マップ編集</span></button></nav><div id="detail" class="detail hidden"><div class="detailCard"><div id="detailName" class="detailName"></div><div id="detailContents" class="detailContents"></div><button id="detailClose" class="detailClose">閉じる</button></div></div><script>const v=document.getElementById('view'),list=document.getElementById('listTab'),mapTab=document.getElementById('mapTab'),editTab=document.getElementById('editTab'),undo=document.getElementById('undo'),redo=document.getElementById('redo'),historyBtns=document.getElementById('historyBtns'),detail=document.getElementById('detail');let undoStack=[],redoStack=[],lastKey='',restoring=false;function state(){try{return v.contentWindow.eval('JSON.stringify(map)')}catch(e){return''}}function buttons(){undo.disabled=!undoStack.length;redo.disabled=!redoStack.length}function isEditing(){try{return!!v.contentWindow.eval('editing')}catch(e){return false}}function syncToolbar(){try{let d=v.contentDocument,toolbar=[...d.querySelectorAll('.card')].find(c=>c.querySelector('.bar>b')?.textContent.trim()==='配置マップ');if(toolbar)toolbar.style.display=isEditing()?'':'none'}catch(e){}}function placeQuickEdit(){try{let d=v.contentDocument,w=d.querySelector('.wrap'),b=document.getElementById('quickEdit');if(!w||!b)return;let r=w.getBoundingClientRect(),fr=v.getBoundingClientRect(),sx=fr.width/(v.contentWindow.innerWidth||fr.width),sy=fr.height/(v.contentWindow.innerHeight||fr.height);b.style.position='fixed';b.style.left=(fr.left+r.right*sx-b.offsetWidth-18)+'px';b.style.right='auto';b.style.top=(fr.top+Math.min(r.bottom,v.contentWindow.innerHeight)*sy-b.offsetHeight-18)+'px';b.style.bottom='auto';b.style.display='block'}catch(e){}}function syncEdit(){let on=isEditing();editTab.classList.toggle('on',on);editTab.innerHTML=(on?'編集終了':'編集モード')+'<span>マップ編集</span>';try{v.contentDocument.getElementById('quickEdit').textContent=on?'表示':'編集'}catch(e){}syncToolbar();historyVisibility();placeQuickEdit()}function snap(){if(restoring)return;let s=state();if(!s)return;if(lastKey&&s!==lastKey){undoStack.push(lastKey);if(undoStack.length>50)undoStack.shift();redoStack=[];lastKey=s;buttons()}else if(!lastKey)lastKey=s}function historyVisibility(){try{let d=v.contentDocument,m=d.getElementById('modal'),figureEdit=m&&!m.classList.contains('hidden');historyBtns.classList.toggle('hidden',!mapTab.classList.contains('on')||!isEditing()||figureEdit)}catch(e){historyBtns.classList.add('hidden')}}function fitText(){try{let d=v.contentDocument;d.querySelectorAll('.block').forEach(b=>{let n=b.querySelector('.blockName'),t=b.querySelector('.blockContents');if(n){n.style.fontSize=t?'9px':'12px';n.style.lineHeight='1.05'}if(!t)return;t.style.overflow='hidden';t.style.fontWeight='900';t.style.lineHeight='1.1';t.style.alignItems='center';t.style.wordBreak='break-word';let z=14;t.style.fontSize=z+'px';while(z>5&&(t.scrollHeight>t.clientHeight+1||t.scrollWidth>t.clientWidth+1)){z-=.5;t.style.fontSize=z+'px'}})}catch(e){}}function styleMap(){try{let d=v.contentDocument;if(!d.getElementById('priority-map-text')){let s=d.createElement('style');s.id='priority-map-text';s.textContent='.blockInner{inset:3px!important}.block.hasContents .blockName{padding:1px 2px 2px!important;margin:0 0 2px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;opacity:.82}.blockContents{min-height:0!important;padding:1px 2px!important;display:flex!important;justify-content:center!important;text-align:center!important;white-space:pre-wrap!important}.block:not(.hasContents) .blockName{align-self:center!important;margin:auto 0!important}';d.head.appendChild(s)}fitText()}catch(e){}}function injectAddon(){try{let d=v.contentDocument;if(d.getElementById('map-addon-script'))return;let s=d.createElement('script');s.id='map-addon-script';s.src='./map-addon.js?v=1';d.body.appendChild(s)}catch(e){}}function openDetail(b){let n=b.querySelector('.blockName')?.textContent?.trim()||'場所',c=b.querySelector('.blockContents')?.textContent?.trim()||'';document.getElementById('detailName').textContent=c?n:'場所';document.getElementById('detailContents').textContent=c||n;detail.classList.remove('hidden')}function closeDetail(){detail.classList.add('hidden')}detail.onclick=e=>{if(e.target===detail)closeDetail()};document.getElementById('detailClose').onclick=closeDetail;function arm(){try{let d=v.contentDocument;lastKey=state();undoStack=[];redoStack=[];buttons();syncEdit();d.addEventListener('pointerdown',()=>{snap();syncEdit()},true);d.addEventListener('pointerup',()=>setTimeout(()=>{snap();syncEdit()},80),true);d.addEventListener('change',()=>setTimeout(()=>{snap();fitText();syncEdit()},50),true);d.addEventListener('click',e=>{setTimeout(()=>{snap();fitText();syncEdit()},80);let b=e.target.closest('.block');if(!b)return;if(!isEditing())openDetail(b)},true);let m=d.getElementById('modal');if(m)new MutationObserver(historyVisibility).observe(m,{attributes:true,attributeFilter:['class']});let target=d.getElementById('blocks');if(target)new MutationObserver(()=>requestAnimationFrame(fitText)).observe(target,{childList:true,subtree:true})}catch(e){}}async function restore(s){if(!s)return;try{restoring=true;let w=v.contentWindow;w.eval('map='+JSON.stringify(JSON.parse(s)));w.eval('data.frontRegisterMap=map;render()');await w.eval('save()');lastKey=s;styleMap();injectAddon()}finally{restoring=false;buttons();syncEdit()}}undo.onclick=async()=>{snap();if(!undoStack.length)return;let cur=state(),s=undoStack.pop();if(cur)redoStack.push(cur);await restore(s)};redo.onclick=async()=>{if(!redoStack.length)return;let cur=state(),s=redoStack.pop();if(cur)undoStack.push(cur);await restore(s)};editTab.onclick=()=>{try{let d=v.contentDocument,b=d.getElementById('edit');if(b)b.click();setTimeout(syncEdit,60)}catch(e){}};document.getElementById('quickEdit').onclick=()=>{try{if(!mapTab.classList.contains('on'))show('map');setTimeout(()=>{try{let d=v.contentDocument,b=d.getElementById('edit');if(b)b.click();setTimeout(syncEdit,100)}catch(e){}},420)}catch(e){}};function show(which){closeDetail();let isMap=which==='map';list.classList.toggle('on',!isMap);mapTab.classList.toggle('on',isMap);editTab.classList.toggle('hidden',!isMap);historyBtns.classList.add('hidden');undoStack=[];redoStack=[];lastKey='';v.src=isMap?'./map.html?v=1':'./index.html?v=1';history.replaceState(null,'',isMap?'#map':'#list')}v.addEventListener('load',()=>{if(mapTab.classList.contains('on'))setTimeout(()=>{styleMap();injectAddon();arm();syncEdit();try{v.contentWindow.addEventListener('scroll',placeQuickEdit);v.contentWindow.addEventListener('resize',placeQuickEdit)}catch(e){}},350)});window.addEventListener('resize',placeQuickEdit);setInterval(placeQuickEdit,700);list.onclick=()=>show('list');mapTab.onclick=()=>show('map');show(location.hash==='#list'?'list':'map');</script></body></html>
